import org.apache.tools.ant.filters.ReplaceTokens
import work.lclpnet.build.task.GithubDeploymentTask

plugins {
    alias(libs.plugins.fabric.loom) apply false
    alias(libs.plugins.gradle.build.utils)
    alias(libs.plugins.kotlin.jvm)
}

static def substitutions(Project project) {
    return [
            version          : project.version.toString(),
            loader_version   : project.libs.versions.fabric.loader.get(),
            minecraft_compat : project.minecraft_compat,
            java_version     : project.libs.versions.java.get(),
    ]
}

def env = System.getenv()
Properties props = buildUtils.loadProperties('publish.properties')  // will be empty if the file is missing

boolean local = System.getProperty("build.local") == "true"
def versionSuffix = (local ? '+local' : '')

def javaVersion = libs.versions.java.get().toInteger()

allprojects {
    apply plugin: libs.plugins.java.get().pluginId
    apply plugin: libs.plugins.maven.publish.get().pluginId
    apply plugin: libs.plugins.fabric.loom.get().pluginId

    group = project.maven_group
    version = "${project.mod_version}+${libs.versions.minecraft.get()}${versionSuffix}"

    def modId = project.mod_id

    base {
        archivesName = modId
    }

    repositories {
        maven {
            url "https://repo.lclpnet.work/repository/internal"
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven {
            url = "https://maven.nucleoid.xyz/"
        }
    }

    dependencies {
        minecraft(libs.minecraft)
        implementation(libs.fabric.loader)
        implementation(libs.fabric.api)
        implementation(libs.fabric.language.kotlin)

        implementation(libs.kibu)
        implementation(libs.kibu.world.api)
        implementation(libs.gaco)
        implementation(libs.fantasy)

        implementation(libs.json)
        include(libs.json)
    }

    configureSubstitutions(processResources, substitutions(it))

    tasks.withType(JavaCompile).configureEach {
        it.options.release.set(javaVersion)
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(javaVersion)
        targetCompatibility = JavaVersion.toVersion(javaVersion)
    }

    kotlin {
        jvmToolchain(javaVersion)
    }

    [jar, sourcesJar].each {
        it.from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}"}
        }
    }

    publishing {
        // automatically use DEPLOY_URL, DEPLOY_USER and DEPLOY_PASSWORD environment variables
        // or mavenHost, mavenUser and mavenPassword from props
        buildUtils.setupPublishRepository(repositories, props)
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "modid" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    def includeImpl = { dep ->
        implementation(dep)
        include(dep)
    }

    includeImpl(libs.commons.compress)
    includeImpl(libs.xz)

    subprojects.each {
        api it
    }
}

// add subprojects as nested jar to the main jar
configurations {
    nestedJars {
        transitive = false
    }
}

dependencies {
    subprojects.each {
        nestedJars project("${it.path}")
    }
}

loom.nestJars(tasks.named("jar"), configurations.nestedJars)

configureSubstitutions(processClientResources, substitutions(rootProject))

tasks.register("github", GithubDeploymentTask) {
    dependsOn tasks.jar

    config {
        token = env.get("GITHUB_TOKEN")
        repository = env.get("GITHUB_REPOSITORY")
    }

    release {
        title = "[${libs.versions.minecraft.get()}] $project.name $project.version"
        tag = project.version
    }

    assets.add(tasks.jar.archiveFile.get())
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.base.archivesName.get()

            from components.java

            pom {
                name = 'game-map-utils'
                description = 'Utilities for creating minigame maps for Minecraft: Java edition'
            }
        }
    }
}

static def configureSubstitutions(ProcessResources task, Map<String, ?> tokens) {
    task.inputs.properties(tokens)

    task.filesMatching("fabric.mod.json") {
        expand tokens
    }

    task.filesMatching("*.mixins.json") {
        filter(ReplaceTokens, beginToken: '${', endToken: '}', tokens: tokens)
    }
}
